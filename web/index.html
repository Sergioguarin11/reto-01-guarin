<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro como Proveedor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
    --accent: #2457d6; --accent-soft: #e8eefc; --ok: #1d7a46; --err: #b42318;
    --warn-bg: #fff6e0; --warn-line: #e2a72e; --user: #2457d6; --user-text: #fff; --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e24; --text: #e6e8eb; --muted: #9aa3ae; --line: #2b313a;
      --accent: #7aa2ff; --accent-soft: #1e2a44; --ok: #4cc283; --err: #ff7b72;
      --warn-bg: #2d2412; --warn-line: #c89530; --user: #3a63d8; --user-text: #fff; --code: #222831;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
  header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 820px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-color: var(--user); white-space: pre-wrap; }
  .msg.err { border-color: var(--err); }
  .msg.confirm { background: var(--warn-bg); border: 2px solid var(--warn-line); }
  .confirm-tag { font-size: 12px; font-weight: 600; color: var(--warn-line); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .confirm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  details.tool { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
  details.tool summary { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tname { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .tok { color: var(--ok); } .terr { color: var(--err); }
  .tres { color: var(--muted); }
  details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); overflow-x: auto; font-size: 12px; max-height: 260px; }
  .thinking { color: var(--muted); font-style: italic; }
  .thinking::after { content: "…"; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { opacity: .2 } 50% { opacity: 1 } 100% { opacity: .2 } }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-height: 44px; max-height: 160px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .chip { text-align: left; font-size: 13px; }
  .files a { display: block; font-size: 13px; color: var(--accent); text-decoration: none; padding: 2px 0; word-break: break-all; }
  .files .caso { font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  .empty { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto; max-width: 460px; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 30vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agente · Registro como Proveedor</h1>
    <span class="badge" id="modelo">conectando…</span>
    <span class="spacer"></span>
    <button id="nueva" type="button">Nueva sesión</button>
  </header>
  <main>
    <div id="log"><div class="hint" id="hint">Elige un caso a la derecha o escribe, por ejemplo: <em>Procesa el caso "ec-corp-andina". No envíes nada todavía.</em></div></div>
    <form id="form">
      <textarea id="input" placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para nueva línea)" rows="1"></textarea>
      <button class="primary" id="enviar" type="submit">Enviar</button>
    </form>
  </main>
  <aside>
    <h2>Casos</h2>
    <div class="chips" id="casos"><span class="empty">Cargando…</span></div>
    <h2>Archivos generados</h2>
    <div class="files" id="archivos"><span class="empty">Aún no hay archivos.</span></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} },
}
let sessionId = store.get("sessionId") || crypto.randomUUID()
store.set("sessionId", sessionId)
let accessKey = store.get("accessKey") || ""
const casosVistos = new Set()

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(accessKey ? { "x-access-key": accessKey } : {}) }
  const res = await fetch(path, { ...opts, headers })
  if (res.status === 401) {
    accessKey = prompt("Este agente requiere una clave de acceso:") || ""
    store.set("accessKey", accessKey)
    if (accessKey) return api(path, opts)
  }
  return res
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])

/** Markdown mínimo y seguro: se escapa todo y luego se aplican negritas, código y listas. */
function md(texto) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  const bloques = []
  let lista = null
  for (const linea of String(texto).split("\n")) {
    const m = linea.match(/^(\s*)[-*•]\s+(.*)/) || linea.match(/^(\s*)\d+[.)]\s+(.*)/)
    if (m) {
      const nivel = Math.min(3, Math.floor(m[1].replace(/\t/g, "  ").length / 2))
      ;(lista ||= []).push(`<li style="margin-left:${nivel * 18}px">${inline(m[2])}</li>`)
      continue
    }
    if (lista) { bloques.push(`<ul>${lista.join("")}</ul>`); lista = null }
    if (linea.trim()) bloques.push(`<p>${inline(linea.replace(/^#+\s*/, ""))}</p>`)
  }
  if (lista) bloques.push(`<ul>${lista.join("")}</ul>`)
  return bloques.join("")
}

function herramientaHtml(t) {
  return `<details class="tool"><summary><span class="${t.ok ? "tok" : "terr"}">${t.ok ? "✓" : "✗"}</span>
    <span class="tname">${esc(t.nombre)}</span><span class="tres">${esc(t.resumen || "")}</span></summary>
    <pre>${esc("args: " + JSON.stringify(t.args, null, 2))}</pre>
    <pre>${esc("resultado: " + JSON.stringify(t.resultado, null, 2))}</pre></details>`
}

function agregar(evento) {
  $("hint")?.remove()
  const div = document.createElement("div")
  if (evento.rol === "usuario") {
    div.className = "msg user"
    div.textContent = evento.texto
  } else {
    div.className = "msg" + (evento.needsConfirmation ? " confirm" : "") + (evento.error ? " err" : "")
    const tools = (evento.toolCalls || []).map(herramientaHtml).join("")
    div.innerHTML =
      (evento.needsConfirmation ? `<div class="confirm-tag">⚠ Se requiere tu confirmación</div>` : "") +
      (tools ? `<div class="tools">${tools}</div>` : "") + md(evento.texto)
    if (evento.needsConfirmation && evento.activo) {
      const acciones = document.createElement("div")
      acciones.className = "confirm-actions"
      acciones.innerHTML = `<button class="primary" type="button">Sí, confirmo</button><button type="button">No</button>`
      const [si, no] = acciones.querySelectorAll("button")
      si.onclick = () => { acciones.remove(); enviar("Sí, confirmo") }
      no.onclick = () => { acciones.remove(); enviar("No, todavía no") }
      div.appendChild(acciones)
    }
    for (const t of evento.toolCalls || []) if (t.args && typeof t.args.caso === "string") casosVistos.add(t.args.caso)
  }
  $("log").appendChild(div)
  $("log").scrollTop = $("log").scrollHeight
  return div
}

async function refrescarArchivos() {
  if (!casosVistos.size) return
  const partes = []
  for (const caso of [...casosVistos].sort()) {
    const r = await api(`/api/archivos/${encodeURIComponent(caso)}`)
    if (!r.ok) continue
    const { archivos } = await r.json()
    if (!archivos.length) continue
    partes.push(`<div class="caso">${esc(caso)}</div>` + archivos.map((a) => `<a href="/out/${encodeURIComponent(caso)}/${a.split("/").map(encodeURIComponent).join("/")}" target="_blank" rel="noopener">${esc(a)}</a>`).join(""))
  }
  $("archivos").innerHTML = partes.join("") || `<span class="empty">Aún no hay archivos.</span>`
}

let ocupado = false
async function enviar(texto) {
  if (ocupado || !texto.trim()) return
  ocupado = true
  $("enviar").disabled = true
  document.querySelectorAll(".confirm-actions").forEach((n) => n.remove())
  agregar({ rol: "usuario", texto })
  const pensando = document.createElement("div")
  pensando.className = "msg thinking"
  pensando.textContent = "Pensando y usando herramientas"
  $("log").appendChild(pensando)
  $("log").scrollTop = $("log").scrollHeight
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId, message: texto }) })
    const data = await res.json()
    pensando.remove()
    if (!res.ok) agregar({ rol: "asistente", texto: `⚠️ ${data.error || "Error del servidor"}`, error: true })
    else agregar({ rol: "asistente", texto: data.reply, toolCalls: data.toolCalls, needsConfirmation: data.needsConfirmation, error: data.error, activo: true })
    await refrescarArchivos()
  } catch {
    pensando.remove()
    agregar({ rol: "asistente", texto: "⚠️ No se pudo contactar al servidor. Revisa tu conexión e inténtalo de nuevo.", error: true })
  } finally {
    ocupado = false
    $("enviar").disabled = false
    $("input").focus()
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; enviar(t) }
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit() } })
$("nueva").onclick = () => { sessionId = crypto.randomUUID(); store.set("sessionId", sessionId); location.reload() }

async function iniciar() {
  try {
    const h = await (await fetch("/api/health")).json()
    $("modelo").textContent = h.llm_configurado ? `${h.provider} · ${h.model}` : "modelo no configurado"
  } catch { $("modelo").textContent = "sin conexión" }

  const rc = await api("/api/casos")
  if (rc.ok) {
    const { casos } = await rc.json()
    $("casos").innerHTML = ""
    for (const c of casos) {
      const b = document.createElement("button")
      b.className = "chip"; b.type = "button"; b.textContent = c
      b.onclick = () => { $("input").value = `Procesa el caso "${c}". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.`; $("input").focus() }
      $("casos").appendChild(b)
    }
  }

  const rs = await api(`/api/sessions/${sessionId}`)
  if (rs.ok) {
    const s = await rs.json()
    s.historial.forEach((ev, i) => agregar({ ...ev, activo: i === s.historial.length - 1 && s.pendienteConfirmacion }))
    await refrescarArchivos()
  }
}
iniciar()
</script>
</body>
</html>
