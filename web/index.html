<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro de proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
<style>
  :root {
    --papel: #eef2f4;
    --hoja: #ffffff;
    --tinta: #1c2b3a;
    --tinta-suave: #556575;
    --pauta: #d3dbe1;
    --sello-rojo: #b3261e;
    --sello-verde: #2e6b4f;
    --resaltador: #f6e27a;
    --resaltador-fondo: #fdf7d6;
    --foco: #2f5f8f;
    --usuario: #1c2b3a;
    --usuario-texto: #f4f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #141c24;
      --hoja: #1b2530;
      --tinta: #e3e9ee;
      --tinta-suave: #98a6b3;
      --pauta: #2c3946;
      --sello-rojo: #ef6a5f;
      --sello-verde: #5fbf8f;
      --resaltador: #c9ab2c;
      --resaltador-fondo: #2b2814;
      --foco: #7fb0e0;
      --usuario: #2c3d50;
      --usuario-texto: #eef3f7;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font: 15px/1.55 "Public Sans", system-ui, -apple-system, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }

  /* Estructura */
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
    padding: 12px 24px; border-bottom: 1px solid var(--pauta); background: var(--hoja);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  header .modelo { font-size: 13px; color: var(--tinta-suave); }
  header .espacio { flex: 1; }
  .boton { border: 1px solid var(--pauta); background: var(--hoja); border-radius: 6px; padding: 7px 14px; font-weight: 500; }
  .boton:hover { border-color: var(--tinta-suave); }
  .boton.principal { background: var(--tinta); color: var(--hoja); border-color: var(--tinta); }

  /* Conversación */
  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 760px; }
  .msg.usuario { align-self: flex-end; background: var(--usuario); color: var(--usuario-texto); padding: 10px 16px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; max-width: 620px; }
  .msg.agente { background: var(--hoja); border: 1px solid var(--pauta); border-radius: 4px 14px 14px 14px; padding: 16px 20px; }
  .msg.agente.error { border-left: 4px solid var(--sello-rojo); }
  .msg.agente.confirmar { border-left: 4px solid var(--resaltador); }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 4px 0 10px; padding-left: 20px; }
  .msg li { margin: 2px 0; }
  .msg code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--papel); padding: 1px 5px; border-radius: 4px; }
  .msg hr { border: 0; border-top: 1px solid var(--pauta); margin: 10px 0; }
  .pregunta { margin: 14px -20px -16px; padding: 14px 20px 16px; background: var(--resaltador-fondo); border-top: 1px solid var(--resaltador); border-radius: 0 0 14px 0; font-weight: 600; }
  .pregunta .acciones { margin-top: 12px; }
  .acciones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* Pasos del agente dentro del mensaje */
  .pasos { list-style: none; margin: 0 0 14px; padding: 0 0 12px; border-bottom: 1px solid var(--pauta); }
  .pasos li { margin: 0; }
  .paso summary { list-style: none; display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 4px 0; cursor: pointer; }
  .paso summary::-webkit-details-marker { display: none; }
  .paso .marca { font-weight: 700; }
  .paso .ok { color: var(--sello-verde); }
  .paso .mal { color: var(--sello-rojo); }
  .paso .titulo { font-weight: 600; }
  .paso .detalle { color: var(--tinta-suave); font-size: 13px; display: block; }
  .paso .tecnico { margin: 6px 0 8px 26px; font-size: 12px; }
  .paso .tecnico div { color: var(--tinta-suave); margin-bottom: 4px; }
  .paso pre { margin: 0 0 6px; padding: 8px 10px; background: var(--papel); border-radius: 6px; overflow-x: auto; max-height: 240px; font-size: 12px; }

  .trabajando { color: var(--tinta-suave); padding: 6px 2px; }
  .trabajando .punto { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--tinta-suave); margin-right: 8px; animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .25 } }

  /* Bandeja inicial */
  .bandeja { max-width: 760px; }
  .bandeja h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.015em; }
  .bandeja > p { margin: 0 0 18px; color: var(--tinta-suave); }
  .correo { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; width: 100%; text-align: left; background: var(--hoja); border: 1px solid var(--pauta); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }
  .correo:hover { border-color: var(--tinta-suave); }
  .correo .cliente { font-weight: 600; }
  .correo .fecha { color: var(--tinta-suave); font-size: 13px; text-align: right; }
  .correo .asunto { color: var(--tinta-suave); font-size: 14px; }
  .correo .formato { font-size: 13px; text-align: right; }

  form { display: flex; gap: 10px; padding: 14px 32px 18px; border-top: 1px solid var(--pauta); background: var(--hoja); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--pauta); background: var(--papel); color: var(--tinta); min-height: 46px; max-height: 160px; }

  /* Expediente */
  aside { border-left: 1px solid var(--pauta); background: var(--hoja); overflow-y: auto; padding: 22px 22px 28px; position: relative; }
  .exp-vacio { color: var(--tinta-suave); font-size: 14px; }
  .exp-vacio strong { color: var(--tinta); display: block; font-size: 16px; margin-bottom: 4px; }
  .exp-cab .id { font-size: 13px; color: var(--tinta-suave); }
  .exp-cab h2 { font-size: 19px; line-height: 1.25; margin: 2px 0 4px; letter-spacing: -0.01em; }
  .exp-cab .meta { font-size: 14px; color: var(--tinta-suave); }
  .bloque { margin-top: 22px; }
  .bloque h3 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .proceso { list-style: none; padding: 0; margin: 0; counter-reset: paso; }
  .proceso li { counter-increment: paso; display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--tinta-suave); font-size: 14px; }
  .proceso li::before { content: counter(paso); width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--pauta); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
  .proceso li.hecho { color: var(--tinta); }
  .proceso li.hecho::before { content: "✓"; background: var(--tinta); border-color: var(--tinta); color: var(--hoja); }
  .proceso li.fallo::before { content: "!"; border-color: var(--sello-rojo); color: var(--sello-rojo); }

  .sello {
    display: inline-block; margin: 18px 0 4px; padding: 6px 14px 4px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    border: 3px double currentColor; border-radius: 6px; transform: rotate(-4deg); opacity: .9;
  }
  .sello.rojo { color: var(--sello-rojo); }
  .sello.verde { color: var(--sello-verde); }
  .sello.nuevo { animation: estampar .35s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes estampar { from { transform: rotate(-4deg) scale(1.6); opacity: 0 } to { transform: rotate(-4deg) scale(1); opacity: .9 } }
  .sello-nota { font-size: 13px; color: var(--tinta-suave); margin-top: 10px; }

  .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--pauta); border: 1px solid var(--pauta); border-radius: 8px; overflow: hidden; }
  .cifras div { background: var(--hoja); padding: 10px 8px; text-align: center; }
  .cifras b { display: block; font-size: 22px; line-height: 1.1; }
  .cifras span { font-size: 12px; color: var(--tinta-suave); }
  .lista { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .lista li { padding: 6px 0; border-bottom: 1px solid var(--pauta); }
  .lista li:last-child { border-bottom: 0; }
  .lista .nota { display: block; font-size: 12px; color: var(--tinta-suave); }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
  .tag.rojo { color: var(--sello-rojo); border: 1px solid currentColor; }
  .tag.amarillo { background: var(--resaltador); color: #1c2b3a; }
  .tag.gris { color: var(--tinta-suave); border: 1px solid var(--pauta); }
  .archivos a { display: block; font-size: 14px; color: var(--foco); text-decoration: none; padding: 3px 0; word-break: break-word; }
  .archivos a:hover { text-decoration: underline; }
  .archivos .sub { font-size: 13px; color: var(--tinta-suave); margin-top: 8px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; height: auto; min-height: 100vh; }
    main { min-height: 60vh; }
    #log { flex: none; }
    aside { border-left: 0; border-top: 1px solid var(--pauta); }
    #log, form { padding-left: 16px; padding-right: 16px; }
    header { padding: 12px 16px; flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sello.nuevo, .trabajando .punto { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Registro de proveedores</h1>
    <span class="modelo" id="modelo">Conectando…</span>
    <span class="espacio"></span>
    <button class="boton" id="nueva" type="button">Nueva conversación</button>
  </header>

  <main>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <label for="input" class="sr" hidden>Mensaje</label>
      <textarea id="input" rows="1" placeholder="Escribe una instrucción, por ejemplo: procesa el caso hn-agroexport-sula"></textarea>
      <button class="boton principal" id="enviar" type="submit">Enviar</button>
    </form>
  </main>

  <aside id="expediente" aria-label="Expediente del caso">
    <div class="exp-vacio"><strong>Sin expediente abierto</strong>Elige una solicitud de la bandeja. Aquí verás el avance, los faltantes, los soportes y los archivos para descargar.</div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
}
let sessionId = store.get("sessionId") || crypto.randomUUID()
store.set("sessionId", sessionId)
let accessKey = store.get("accessKey") || ""
let casos = []
const PAISES = { CO: "Colombia", EC: "Ecuador", PE: "Perú", PA: "Panamá", HN: "Honduras" }
const FORMATOS = { xlsx: "Excel", pdf: "PDF", portal: "Portal web" }
const SOPORTES = { camara_comercio: "Cámara de Comercio", rut: "RUT", certificacion_bancaria: "Certificación bancaria", estados_financieros: "Estados financieros", parafiscales: "Parafiscales y seguridad social", certificado_cumplimiento_tributario: "Certificado de cumplimiento tributario" }
const nombreSoporte = (t) => SOPORTES[t] || t.replace(/_/g, " ")
const PASOS = [
  ["proveedor_leer_solicitud", "Leer la solicitud"],
  ["proveedor_mapear_campos", "Cruzar campos con el maestro"],
  ["proveedor_generar_formulario", "Generar el formulario"],
  ["proveedor_armar_paquete", "Armar el paquete para firma"],
  ["proveedor_simular_envio", "Envío (con tu confirmación)"],
]
const VERBOS = {
  proveedor_leer_solicitud: "Leyó la solicitud",
  proveedor_mapear_campos: "Cruzó los campos con el maestro",
  proveedor_generar_formulario: "Generó el formulario",
  proveedor_armar_paquete: "Armó el paquete para firma",
  proveedor_simular_envio: "Simuló el envío",
}

// Estado del expediente por caso, construido solo con resultados de herramientas.
const expedientes = {}
let casoActivo = null
let selloMostrado = {}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(accessKey ? { "x-access-key": accessKey } : {}) }
  const res = await fetch(path, { ...opts, headers })
  if (res.status === 401) {
    accessKey = prompt("Este agente requiere una clave de acceso:") || ""
    store.set("accessKey", accessKey)
    if (accessKey) return api(path, opts)
  }
  return res
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])

function md(texto) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|\s)\*([^*]+)\*(?=\s|$|[.,;:])/g, "$1<em>$2</em>")
  const out = []
  let lista = null
  const cerrar = () => { if (lista) { out.push(`<ul>${lista.join("")}</ul>`); lista = null } }
  for (const linea of String(texto).split("\n")) {
    const m = linea.match(/^(\s*)[-*•]\s+(.*)/) || linea.match(/^(\s*)\d+[.)]\s+(.*)/)
    if (m) {
      const nivel = Math.min(3, Math.floor(m[1].replace(/\t/g, "  ").length / 2))
      ;(lista ||= []).push(`<li style="margin-left:${nivel * 18}px">${inline(m[2])}</li>`)
      continue
    }
    cerrar()
    if (/^\s*-{3,}\s*$/.test(linea)) { out.push("<hr>"); continue }
    if (linea.trim()) out.push(`<p>${inline(linea.replace(/^#+\s*/, ""))}</p>`)
  }
  cerrar()
  return out.join("")
}

/** Separa la pregunta de confirmación del cuerpo para destacarla. */
function separarPregunta(texto) {
  const i = texto.search(/❓?\s*Confirmación requerida:/)
  if (i < 0) return [texto, ""]
  const p = texto.slice(i).replace(/^❓?\s*Confirmación requerida:\s*/, "")
  return [texto.slice(0, i).replace(/\n\s*-{3,}\s*$/, ""), p.charAt(0).toUpperCase() + p.slice(1)]
}

function detallePaso(t) {
  const d = t.resultado && t.resultado.data
  if (!t.ok) return t.resumen
  if (!d) return t.resumen
  switch (t.nombre) {
    case "proveedor_leer_solicitud": return `${d.cliente} · ${PAISES[d.pais] || d.pais} · ${FORMATOS[d.formato] || d.formato} · ${d.campos.length} campos`
    case "proveedor_mapear_campos": return `${d.llenos.length} llenos, ${d.faltantes.length} faltantes, ${d.requiere_confirmacion.length} por confirmar`
    case "proveedor_generar_formulario": return d.soportado === false ? "Formato no soportado: se prepararon valores para copiar" : d.ruta
    case "proveedor_armar_paquete": return d.listo_para_firma ? "Listo para firma" : `No listo para firma · ${d.bloqueos.length} bloqueo(s)`
    case "proveedor_simular_envio": return d.ruta
    default: return t.resumen
  }
}

function pasosHtml(toolCalls) {
  if (!toolCalls || !toolCalls.length) return ""
  return `<ol class="pasos">${toolCalls.map((t) => `
    <li><details class="paso"><summary>
      <span class="marca ${t.ok ? "ok" : "mal"}" aria-label="${t.ok ? "correcto" : "error"}">${t.ok ? "✓" : "✗"}</span>
      <span><span class="titulo">${esc(t.ok ? VERBOS[t.nombre] || t.nombre : `No se pudo: ${VERBOS[t.nombre] || t.nombre}`)}</span>
      <span class="detalle">${esc(detallePaso(t))}</span></span>
    </summary>
    <div class="tecnico"><div>Herramienta: <code>${esc(t.nombre)}</code></div>
      <pre>${esc("argumentos: " + JSON.stringify(t.args, null, 2))}</pre>
      <pre>${esc("resultado: " + JSON.stringify(t.resultado, null, 2))}</pre></div>
    </details></li>`).join("")}</ol>`
}

function agregar(ev) {
  const div = document.createElement("div")
  if (ev.rol === "usuario") {
    div.className = "msg usuario"
    div.textContent = ev.texto
  } else {
    const [cuerpo, pregunta] = separarPregunta(ev.texto || "")
    div.className = "msg agente" + (ev.needsConfirmation ? " confirmar" : "") + (ev.error ? " error" : "")
    div.innerHTML = pasosHtml(ev.toolCalls) + md(cuerpo) + (pregunta && ev.needsConfirmation ? `<div class="pregunta">${md(pregunta)}</div>` : pregunta ? md(pregunta) : "")
    if (ev.needsConfirmation && ev.activo) {
      const acciones = document.createElement("div")
      acciones.className = "acciones"
      acciones.innerHTML = `<button class="boton principal" type="button">Sí, confirmo</button><button class="boton" type="button">No, todavía no</button>`
      const [si, no] = acciones.querySelectorAll("button")
      si.onclick = () => enviar("Sí, confirmo")
      no.onclick = () => enviar("No, todavía no")
      ;(div.querySelector(".pregunta") || div).appendChild(acciones)
    }
    actualizarExpediente(ev.toolCalls || [], ev.animar)
  }
  $("log").appendChild(div)
  $("log").scrollTop = $("log").scrollHeight
}

// ---------------- Expediente ----------------
function actualizarExpediente(toolCalls, animar) {
  for (const t of toolCalls) {
    const caso = t.args && t.args.caso
    if (typeof caso !== "string") continue
    const e = (expedientes[caso] ||= { caso, pasos: {} })
    e.pasos[t.nombre] = t.ok ? "hecho" : "fallo"
    const d = t.ok && t.resultado && t.resultado.data
    if (!d) continue
    if (t.nombre === "proveedor_leer_solicitud") Object.assign(e, { cliente: d.cliente, pais: d.pais, formato: d.formato, total: d.campos.length })
    if (t.nombre === "proveedor_mapear_campos") Object.assign(e, { llenos: d.llenos.length, faltantes: d.faltantes, confirmar: d.requiere_confirmacion })
    if (t.nombre === "proveedor_armar_paquete") { Object.assign(e, { listo: d.listo_para_firma, bloqueos: d.bloqueos, checklist: d.checklist }); delete e.enviado }
    if (t.nombre === "proveedor_simular_envio") e.enviado = true
    casoActivo = caso
  }
  if (casoActivo) pintarExpediente(animar)
}

async function pintarExpediente(animar) {
  const e = expedientes[casoActivo]
  if (!e) return
  const info = casos.find((c) => c.id === e.caso) || {}
  const cliente = e.cliente || info.cliente || e.caso
  const pais = e.pais || info.pais
  const formato = e.formato || info.formato
  const conSello = typeof e.listo === "boolean"
  const nuevoSello = conSello && animar && selloMostrado[e.caso] !== e.listo
  if (conSello) selloMostrado[e.caso] = e.listo

  let archivos = []
  try {
    const r = await api(`/api/archivos/${encodeURIComponent(e.caso)}`)
    if (r.ok) archivos = (await r.json()).archivos
  } catch {}
  const enlace = (a) => `<a href="/out/${encodeURIComponent(e.caso)}/${a.split("/").map(encodeURIComponent).join("/")}" target="_blank" rel="noopener">${esc(a.replace(/^paquete\//, ""))}</a>`
  const principales = archivos.filter((a) => !a.startsWith("paquete/") && a !== "log.jsonl")
  const paquete = archivos.filter((a) => a.startsWith("paquete/"))

  const ch = e.checklist || {}
  const soportes = [
    ...(ch.vencidos || []).map((v) => `<li><span class="tag rojo">Vencido</span>${esc(nombreSoporte(v.tipo))}<span class="nota">Vigente hasta ${esc(v.vigencia_hasta)}</span></li>`),
    ...(ch.ausentes || []).map((a) => `<li><span class="tag rojo">Ausente</span>${esc(nombreSoporte(a))}</li>`),
  ]
  const pendientes = [
    ...(e.faltantes || []).map((f) => `<li><span class="tag gris">Faltante</span>${esc(f.etiqueta)}<span class="nota">Diligenciar a mano</span></li>`),
    ...(e.confirmar || []).map((c) => `<li><span class="tag amarillo">Confirmar</span>${esc(c.etiqueta)}<span class="nota">${esc(c.nota || "")}</span></li>`),
  ]

  $("expediente").innerHTML = `
    <div class="exp-cab">
      <div class="id">Expediente ${esc(e.caso)}</div>
      <h2>${esc(cliente)}</h2>
      <div class="meta">${esc(PAISES[pais] || pais || "")}${formato ? ` · ${esc(FORMATOS[formato] || formato)}` : ""}</div>
    </div>
    ${conSello ? `<div class="sello ${e.listo ? "verde" : "rojo"}${nuevoSello ? " nuevo" : ""}">${e.listo ? "Listo para firma" : "No listo para firma"}</div>
      <div class="sello-nota">${e.enviado ? "Envío simulado registrado." : e.listo ? "Pendiente de firma del representante legal." : `${(e.bloqueos || []).length} bloqueo(s) por resolver.`}</div>` : ""}
    <div class="bloque"><h3>Avance</h3><ol class="proceso">
      ${PASOS.map(([n, t]) => `<li class="${e.pasos[n] || ""}">${t}</li>`).join("")}
    </ol></div>
    ${typeof e.llenos === "number" ? `<div class="bloque"><h3>Campos del formulario</h3><div class="cifras">
      <div><b>${e.llenos}</b><span>llenos</span></div>
      <div><b>${(e.faltantes || []).length}</b><span>faltantes</span></div>
      <div><b>${(e.confirmar || []).length}</b><span>por confirmar</span></div></div></div>` : ""}
    ${pendientes.length ? `<div class="bloque"><h3>Para revisar</h3><ul class="lista">${pendientes.join("")}</ul></div>` : ""}
    ${soportes.length ? `<div class="bloque"><h3>Soportes por actualizar</h3><ul class="lista">${soportes.join("")}</ul></div>` : ""}
    ${archivos.length ? `<div class="bloque archivos"><h3>Archivos</h3>${principales.map(enlace).join("")}
      ${paquete.length ? `<div class="sub">Paquete para firma</div>${paquete.map(enlace).join("")}` : ""}</div>` : ""}
  `
}

// ---------------- Bandeja ----------------
function mostrarBandeja() {
  const div = document.createElement("div")
  div.className = "bandeja"
  div.id = "bandeja"
  div.innerHTML = `<h2>Bandeja de solicitudes</h2>
    <p>Elige una solicitud y el agente prepara el formulario y el paquete para firma. Nada se envía sin tu confirmación.</p>
    ${casos.map((c) => `<button class="correo" type="button" data-caso="${esc(c.id)}">
      <span class="cliente">${esc(c.cliente || c.id)}</span><span class="fecha">${esc(c.fecha || "")}</span>
      <span class="asunto">${esc(c.asunto || "")}</span><span class="formato">${esc(PAISES[c.pais] || c.pais || "")} · ${esc(FORMATOS[c.formato] || c.formato || "")}</span>
    </button>`).join("")}`
  div.querySelectorAll(".correo").forEach((b) => {
    b.onclick = () => enviar(`Procesa el caso "${b.dataset.caso}". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.`)
  })
  $("log").appendChild(div)
}

// ---------------- Envío de mensajes ----------------
let ocupado = false
async function enviar(texto) {
  if (ocupado || !texto.trim()) return
  ocupado = true
  $("enviar").disabled = true
  $("bandeja")?.remove()
  document.querySelectorAll(".acciones").forEach((n) => n.remove())
  agregar({ rol: "usuario", texto })
  const espera = document.createElement("div")
  espera.className = "trabajando"
  const inicio = Date.now()
  const pintarEspera = () => { espera.innerHTML = `<span class="punto"></span>El agente está trabajando… ${Math.round((Date.now() - inicio) / 1000)} s` }
  pintarEspera()
  const reloj = setInterval(pintarEspera, 1000)
  $("log").appendChild(espera)
  $("log").scrollTop = $("log").scrollHeight
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId, message: texto }) })
    const data = await res.json()
    if (!res.ok) agregar({ rol: "asistente", texto: data.error || "El servidor no pudo procesar el mensaje.", error: true })
    else agregar({ rol: "asistente", texto: data.reply, toolCalls: data.toolCalls, needsConfirmation: data.needsConfirmation, error: data.error, activo: true, animar: true })
  } catch {
    agregar({ rol: "asistente", texto: "No hay conexión con el servidor. Revisa tu conexión y vuelve a enviar el mensaje.", error: true })
  } finally {
    clearInterval(reloj)
    espera.remove()
    ocupado = false
    $("enviar").disabled = false
    $("input").focus()
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; enviar(t) }
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit() } })
$("nueva").onclick = () => { store.set("sessionId", crypto.randomUUID()); location.reload() }

async function iniciar() {
  try {
    const h = await (await fetch("/api/health")).json()
    $("modelo").textContent = h.llm_configurado ? `Modelo: ${h.model}` : "Modelo no configurado"
  } catch { $("modelo").textContent = "Sin conexión con el servidor" }

  try {
    const rc = await api("/api/casos")
    if (rc.ok) casos = (await rc.json()).casos.map((c) => (typeof c === "string" ? { id: c } : c))
  } catch {}

  let historial = []
  let pendiente = false
  try {
    const rs = await api(`/api/sessions/${sessionId}`)
    if (rs.ok) { const s = await rs.json(); historial = s.historial; pendiente = s.pendienteConfirmacion }
  } catch {}

  if (!historial.length) mostrarBandeja()
  historial.forEach((ev, i) => agregar({ ...ev, activo: pendiente && i === historial.length - 1 }))
}
iniciar()
</script>
